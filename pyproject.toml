[project]
name = "securepay-csv"
version = "0.1.0"
description = "File sources for SecurePay: Kaggle datasets and daily partner statements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "securepay-shared>=0.1.0",
    "boto3>=1.43.113",
    "kaggle>=2.2.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/securepay_csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "integracion: necesita LocalStack levantado (se salta sola si no está)",
]
